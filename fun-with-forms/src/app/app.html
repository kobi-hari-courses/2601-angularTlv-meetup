<div class="form">
  <h3>Dinner Review</h3>
  <app-field label="Username">
    <input [formField]="frm.username" type="text" />
  </app-field>

  <app-field label="Title">
    <input [formField]="frm.title" type="text" />
  </app-field>

  <app-field label="Description">
    <textarea [formField]="frm.description" rows="4"></textarea>
  </app-field>

  <app-field label="Rating">
    <app-star-rating [formField]="frm.rating"/>
  </app-field>
</div>

<div class="model">
  <h3>Dinner Review Model</h3>
  <pre><code>{{model() | json}}

  </code></pre>
</div>
