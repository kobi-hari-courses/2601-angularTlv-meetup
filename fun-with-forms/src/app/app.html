<div class="form">
  <h3>Dinner Review</h3>
  <div class="field">
    <label>Username</label>
    <input [formField]="frm.username" type="text" />
  </div>

  <div class="field">
    <label>Title</label>
    <input [formField]="frm.title" type="text" />
  </div>

  <div class="field">
    <label>Description</label>
    <textarea [formField]="frm.description" rows="4"></textarea>
  </div>
  <div class="field">
    <label>Rating</label>
    <app-star-rating [formField]="frm.rating"/>
  </div>
</div>

<div class="model">
  <h3>Dinner Review Model</h3>
  <pre><code>{{model() | json}}

  </code></pre>
</div>
